---
layout: default
---

<h1>{{ page.title }}</h1>

<ul class="post-list">
  {% for post in site.posts %}
    {% if post.categories contains page.category %}
      <li>
        <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
        <h2>
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title }}
          </a>
        </h2>
      </li>
    {% endif %}
  {% endfor %}
</ul>
